
bt_navigator:
  ros__parameters:
    navigators: ["navigate_to_pose"]  # Solo activa este navegador
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" 
      bt_xml_filename: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning.xml"
    navigate_through_poses:
      enabled: false  # Desactiva explícitamente
   
   

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker" 
    # Plugins principales
    plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_velocity: 0.05
      min_vel_x: 0.05       # Velocidad lineal mínima
      max_rotational_vel: 0.3  # Velocidad angular máxima (rad/s)
      acc_lim_x: 0.1        # Aceleración lineal (m/s²)
      acc_lim_theta: 0.2    # Aceleración angular (rad/s²)
      max_angular_velocity: 0.2
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.8
      transform_tolerance: 1.0
      goal_dist_tol: 0.3 
    
    # Verificadores REQUERIDOS (eliminarán las advertencias)
    goal_checker_plugins: ["general_goal_checker"]
    progress_checker_plugins: ["progress_checker"]
    
    # Configuración del goal checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25  # Metros
      yaw_goal_tolerance: 0.2  # Radianes
      stateful: true
    
    # Configuración del progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2  # Robot debe moverse al menos 0.5m
      movement_time_allowance: 10.0  # Tiempo máximo sin movimiento (segundos)
    

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "map"              # Usa el mapa global de RTAB-Map
      robot_base_frame: "base_link"
      resolution: 0.05
      robot_radius: 0.25
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true   # Para engancharse al mapa latched de RTAB-Map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0    # REDUCIR a 5Hz
      publish_frequency: 2.0   # REDUCIR publicación
      transform_tolerance: 1.0
      use_sim_time: false 
      global_frame: "odom"             # Local costmap no depende del mapa global
      robot_base_frame: "base_link"
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["inflation_layer","obstacle_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
      obstacle_layer:
       plugin: "nav2_costmap_2d::ObstacleLayer"
       observation_sources: "scan"
       scan:
         topic: "/scan"  # Asegúrate que RTAB-Map publique aquí
         max_obstacle_height: 0.4
         raytrace_max_range: 2.5 
         obstacle_max_range: 3.0 
         combination_method: 1
         clearing: true
         marking: true
        
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

